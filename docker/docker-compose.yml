# SeptMuse Docker Compose — 基础文件 (SQLite 零配置)
# 用法 (从项目根目录执行):
#   docker compose -f docker/docker-compose.yml up                              # SQLite 零配置
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.pg.yml up     # PostgreSQL
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.mysql.yml up  # MySQL
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up  # 本地开发
#
# 接入:
#   REST:  http://localhost:8000/docs
#   MCP:   http://localhost:8000/mcp/http/cursor/alice
#   SSE:   http://localhost:8000/mcp/sse/cursor/alice

services:
  septmuse:
    build:
      context: ..
      dockerfile: Dockerfile
    image: septmuse:latest
    container_name: septmuse
    ports:
      - "8000:8000"
    volumes:
      - septmuse-data:/data
    environment:
      - SEPTMUSE_DB_PATH=/data/septmuse.db
      - SEPTMUSE_EMBEDDER=hash
      - SEPTMUSE_INFER=false
      # API 认证 (未设=开发模式)
      - SEPTMUSE_API_KEY=${SEPTMUSE_API_KEY:-}
      # LLM (启用 SEPTMUSE_INFER=true 时按需设)
      - SEPTMUSE_LLM=${SEPTMUSE_LLM:-}
      - SEPTMUSE_LLM_MODEL=${SEPTMUSE_LLM_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    networks:
      - septmuse-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  septmuse-net:
    driver: bridge

volumes:
  septmuse-data: