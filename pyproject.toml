[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "septmuse"
version = "0.1.0"
description = "SeptMuse — agent 记忆系统 (三维正交架构: 内容类型 × 存储形态 × 横切关注点)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "sonhhxg0529" },
]
keywords = ["agent", "memory", "llm", "mcp", "knowledge-graph", "fastapi", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# 核心依赖: 零配置开箱即用 (pip install septmuse 即可跑, 零外部服务, 无 torch)
dependencies = [
  "fastapi>=0.110",
  "sqlmodel>=0.0.16",
  "structlog>=24.1",
  "mcp>=1.0",
  "anyio>=4.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "numpy>=1.26",
  # 中文分词 (BM25 关键词检索质量, 零配置, 纯 Python ~5MB)
  "jieba>=0.42",
  # 异步存储后端 (aiosqlite, AsyncMemory 使用)
  "aiosqlite>=0.20",
  # 默认向量后端 (sqlite-vec, 零外部服务)
  "sqlite-vec>=0.1.0",
  # 可观测性指标 (Prometheus)
  "prometheus-client>=0.16.0",
  # Qdrant 向量数据库客户端 (纯 Python client, 安装零外部服务)
  "qdrant-client>=1.12.0",
]

[project.optional-dependencies]
# ── LLM providers (单个安装或用 llms 一次装全) ──
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.3"]
dashscope = ["dashscope>=1.17"]
litellm = ["litellm>=1.40"]
groq = ["groq>=0.11"]
gemini = ["google-generativeai>=0.7"]
llms = ["septmuse[openai,anthropic,ollama,dashscope,litellm,groq,gemini]"]

# ── 向量/图存储后端 ──
chroma = ["chromadb>=0.5.0"]
qdrant = ["qdrant-client>=1.9.0"]
vector-stores = ["septmuse[chroma,qdrant]"]
neo4j = ["neo4j>=5.20"]
graph-stores = ["septmuse[neo4j]"]

# ── 关系型/内存后端 ──
postgres = ["psycopg[binary,pool]>=3.1", "psycopg2-binary>=2.9", "pgvector>=0.3"]
mysql = ["aiomysql>=0.2", "pymysql>=1.1"]
redis = ["redis>=5.0"]
bm25 = ["rank-bm25>=0.2.2"]
backends = ["septmuse[postgres,mysql,redis,bm25]"]

# ── Embedder (ONNX 轻量 / sentence-transformers 重型) ──
onnx = ["onnxruntime>=1.16", "tokenizers>=0.15", "modelscope>=1.10"]
st = ["sentence-transformers>=3.0"]

# ── 新增 Embedder providers ──
langchain = ["langchain>=0.1"]
azure-openai = ["openai>=1.30", "azure-identity>=1.16"]
vertexai = ["google-cloud-aiplatform>=1.50"]
aws-bedrock = ["boto3>=1.34"]
fastembed = ["fastembed>=0.3.0"]

# ── Embedder 聚合 ──
embedders = ["septmuse[onnx,st,openai,ollama,gemini,langchain,azure-openai,vertexai,aws-bedrock,fastembed]"]

# ── Reranker ──
reranker = ["onnxruntime>=1.16"]
reranker-st = ["sentence-transformers>=3.0"]
rerankers = ["septmuse[reranker,reranker-st]"]

# ── NER 实体抽取后端 (spacy, 替代默认 regex) ──
ner = ["spacy>=3.7"]

# ── 激活/参数化记忆 (自托管模型, 需 torch) ──
activation = ["transformers>=4.40", "torch>=2.2"]
parametric = ["transformers>=4.40", "torch>=2.2", "peft>=0.11"]

# ── HTTP server (CLI serve 命令需要) ──
server = ["uvicorn>=0.29"]

# ── 开发 ──
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

# ── 全量安装 ──
all = ["septmuse[llms,vector-stores,graph-stores,backends,embedders,rerankers,ner,activation,parametric,server,dev]"]

[project.scripts]
septmuse = "septmuse.cli.main:main"

[project.urls]
Homepage = "https://github.com/sonhhxg0529/solarseptem-ai/tree/main/solarseptem-ai-platform/SeptMuse"
Documentation = "https://github.com/sonhhxg0529/solarseptem-ai/tree/main/solarseptem-ai-platform/SeptMuse/docs"
Repository = "https://github.com/sonhhxg0529/solarseptem-ai/tree/main/solarseptem-ai-platform/SeptMuse"
"Bug Tracker" = "https://github.com/sonhhxg0529/solarseptem-ai/issues"
Changelog = "https://github.com/sonhhxg0529/solarseptem-ai/tree/main/solarseptem-ai-platform/SeptMuse/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatchling 构建配置 (src/ layout)
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/septmuse"]

[tool.hatch.build.targets.sdist]
include = ["src/septmuse", "docs", "examples", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Ruff (lint + format, 对齐 mem0 规范: line-length 120)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
exclude = ["opensource", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # RUF001/002/003: 中文全角标点, 中文项目忽略

[tool.ruff.lint.isort]
known-first-party = ["septmuse"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "unit: 单元测试",
  "integration: 集成测试",
  "e2e: 端到端测试",
  "slow: 耗时测试",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/septmuse"]
exclude = ["opensource", "tests"]
