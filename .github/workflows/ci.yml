name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.5

      - name: Ruff check
        run: ruff check src/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + server extras
        run: pip install -e ".[dev,server]"

      - name: Run unit tests
        run: pytest tests/unit/ -q

      - name: Run e2e tests
        run: pytest tests/e2e/ -q

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: .pytest_cache/
          retention-days: 7

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel contents
        run: |
          python -c "import zipfile; z=zipfile.ZipFile('dist/septmuse-0.1.0-py3-none-any.whl'); names=z.namelist(); assert 'septmuse-0.1.0.dist-info/licenses/LICENSE' in names, 'LICENSE missing'; assert any(n.endswith('METADATA') for n in names), 'METADATA missing'; print(f'wheel OK: {len(names)} files')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
