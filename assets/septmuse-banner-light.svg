<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="hl" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ede9fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkFilter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#hl)"/>

  <!-- Subtle grid -->
  <g stroke="#e2e8f0" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- ===== SeptMuse Logo Mark (left side) ===== -->
  <g transform="translate(320, 320)">

    <!-- Core pulse aura -->
    <circle cx="0" cy="0" r="120" fill="url(#corePulse)"/>

    <!-- Outer orbital ring (memory cycle) -->
    <ellipse cx="0" cy="0" rx="180" ry="68" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.12" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="140" ry="52" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15" transform="rotate(25)"/>

    <!-- ===== Memory shard fragments (geometric, layered) ===== -->
    <path d="M 0,-130 L 113,-65 L 113,65 L 0,130 L -113,65 L -113,-65 Z"
          fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.25" stroke-linejoin="round" filter="url(#sg)"/>

    <path d="M 0,-95 L 82,-47 L 82,47 L 0,95 L -82,47 L -82,-47 Z"
          fill="none" stroke="#7c3aed" stroke-width="2.5" opacity="0.2" stroke-linejoin="round" transform="rotate(30)"/>

    <!-- ===== Neural network connections (synapses) ===== -->
    <line x1="0" y1="0" x2="0" y2="-110" stroke="#7c3aed" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="95" y2="-55" stroke="#7c3aed" stroke-width="1.8" opacity="0.22" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="95" y2="55" stroke="#7c3aed" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="110" stroke="#7c3aed" stroke-width="1.8" opacity="0.22" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-95" y2="55" stroke="#7c3aed" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-95" y2="-55" stroke="#7c3aed" stroke-width="1.8" opacity="0.22" stroke-linecap="round"/>

    <!-- Cross synapses -->
    <line x1="0" y1="-110" x2="95" y2="-55" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
    <line x1="95" y1="-55" x2="95" y2="55" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
    <line x1="95" y1="55" x2="0" y2="110" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
    <line x1="0" y1="110" x2="-95" y2="55" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
    <line x1="-95" y1="55" x2="-95" y2="-55" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
    <line x1="-95" y1="-55" x2="0" y2="-110" stroke="#7c3aed" stroke-width="1" opacity="0.14" stroke-linecap="round"/>

    <!-- ===== Central Memory Core (M monogram) ===== -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#7c3aed" stroke-width="7" opacity="0.3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#7c3aed" stroke-width="4.5" opacity="0.85" filter="url(#glow)"/>

    <!-- M monogram -->
    <path d="M -28,22 L -28,-22 L 0,-2 L 28,-22 L 28,22"
          fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#sg)"/>

    <!-- Inner accent dot -->
    <circle cx="0" cy="-2" r="3.5" fill="#7c3aed" opacity="0.6" filter="url(#sg)"/>

    <!-- ===== 6 Memory nodes ===== -->
    <circle cx="0" cy="-110" r="14" fill="#7c3aed" opacity="0.95" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="-110" r="8" fill="white"/>
    <circle cx="0" cy="-110" r="3.5" fill="#7c3aed" opacity="0.7"/>

    <circle cx="95" cy="-55" r="12" fill="#7c3aed" opacity="0.92" filter="url(#nodeGlow)"/>
    <circle cx="95" cy="-55" r="7" fill="white"/>
    <circle cx="95" cy="-55" r="3" fill="#7c3aed" opacity="0.65"/>

    <circle cx="95" cy="55" r="14" fill="#7c3aed" opacity="0.95" filter="url(#nodeGlow)"/>
    <circle cx="95" cy="55" r="8" fill="white"/>
    <circle cx="95" cy="55" r="3.5" fill="#7c3aed" opacity="0.7"/>

    <circle cx="0" cy="110" r="11" fill="#8b5cf6" opacity="0.9" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="110" r="6.5" fill="white"/>
    <circle cx="0" cy="110" r="2.8" fill="#7c3aed" opacity="0.6"/>

    <circle cx="-95" cy="55" r="12" fill="#7c3aed" opacity="0.92" filter="url(#nodeGlow)"/>
    <circle cx="-95" cy="55" r="7" fill="white"/>
    <circle cx="-95" cy="55" r="3" fill="#7c3aed" opacity="0.65"/>

    <circle cx="-95" cy="-55" r="14" fill="#7c3aed" opacity="0.95" filter="url(#nodeGlow)"/>
    <circle cx="-95" cy="-55" r="8" fill="white"/>
    <circle cx="-95" cy="-55" r="3.5" fill="#7c3aed" opacity="0.7"/>

    <!-- ===== Muse spark ===== -->
    <circle cx="140" cy="-100" r="18" fill="url(#sparkGlow)"/>
    <polygon points="140,-114 150,-100 140,-86 130,-100" fill="#f59e0b" opacity="0.9" filter="url(#sparkFilter)"/>
    <circle cx="140" cy="-100" r="3" fill="white" opacity="0.8"/>
    <circle cx="158" cy="-115" r="2" fill="#f59e0b" opacity="0.35" filter="url(#softGlow)"/>
    <circle cx="162" cy="-92" r="1.5" fill="#f59e0b" opacity="0.3" filter="url(#softGlow)"/>

    <!-- ===== Energy flow particles ===== -->
    <circle cx="0" cy="-75" r="2" fill="#7c3aed" opacity="0.25"/>
    <circle cx="50" cy="-30" r="1.5" fill="#7c3aed" opacity="0.2"/>
    <circle cx="55" cy="30" r="2" fill="#7c3aed" opacity="0.22"/>
    <circle cx="0" cy="75" r="1.5" fill="#7c3aed" opacity="0.18"/>
    <circle cx="-50" cy="30" r="2" fill="#7c3aed" opacity="0.22"/>
    <circle cx="-55" cy="-30" r="1.5" fill="#7c3aed" opacity="0.2"/>

  </g>

  <!-- ===== Text (right side) ===== -->
  <text x="720" y="240" fill="#0f172a" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="64" font-weight="700" letter-spacing="4">SeptMuse</text>
  <text x="720" y="300" fill="#475569" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="26" font-weight="500" letter-spacing="8">AI 记忆平台</text>

  <!-- Accent line -->
  <line x1="720" y1="330" x2="1000" y2="330" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Feature tags -->
  <g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400">
    <rect x="720" y="360" width="120" height="34" rx="17" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <text x="780" y="382" text-anchor="middle" fill="#7c3aed">长期记忆</text>

    <rect x="852" y="360" width="120" height="34" rx="17" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <text x="912" y="382" text-anchor="middle" fill="#7c3aed">知识图谱</text>

    <rect x="984" y="360" width="120" height="34" rx="17" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
    <text x="1044" y="382" text-anchor="middle" fill="#7c3aed">智能检索</text>
  </g>

  <!-- Tagline -->
  <text x="720" y="440" fill="#94a3b8" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" letter-spacing="2">让 AI 拥有持久记忆，积累每一次对话的智慧</text>

  <!-- Tech stack -->
  <text x="720" y="490" fill="#cbd5e1" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" letter-spacing="1">向量数据库 · 知识图谱 · 语义检索 · 记忆蒸馏</text>
</svg>